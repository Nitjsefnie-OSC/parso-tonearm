<!doctype html>
<meta charset="utf-8">
<title>Now Playing — Blending now reference (issue #74)</title>
<style>
  body{font:14px -apple-system,system-ui,sans-serif;margin:0;display:flex;gap:24px;padding:24px;background:#888}
  .phone{width:360px;border-radius:28px;padding:20px;box-sizing:border-box}
  .light{background:#fff;color:#111;--sec:#666;--acc:#0a63d8;--line:#d0d0d0;--card:#f3f3f6}
  .dark{background:#111;color:#f2f2f2;--sec:#a0a0a8;--acc:#4da3ff;--line:#3a3a40;--card:#1e1e22}
  .art{height:140px;border-radius:16px;background:var(--line);margin-bottom:10px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;margin:10px 0}
  .head{display:flex;justify-content:space-between;font-weight:600}.head b{color:var(--acc)}
  .decks{display:flex;gap:12px;margin:8px 0}.deck{flex:1}
  .deck small{color:var(--sec);display:block}
  .wave{display:flex;align-items:center;gap:2px;height:24px;margin:4px 0}
  .wave i{display:block;width:100%;background:var(--sec);border-radius:2px}
  .in .wave i{background:var(--acc)}
  .rail{display:flex;gap:4px}.rail span{flex:1;text-align:center;border:1px solid var(--line);border-radius:12px;padding:3px;color:var(--sec)}
  .rail .on{border:2px solid var(--acc);color:inherit;font-weight:700}
  .bar{height:4px;background:var(--line);border-radius:2px;margin-top:6px}.bar div{width:50%;height:4px;background:var(--acc);border-radius:2px}
  .transport,.tools{display:flex;justify-content:space-around;margin:12px 0;font-size:22px}
  .tools span{border:1px solid var(--line);border-radius:50%;padding:6px 10px;font-size:16px}
  .menu{border:1px solid var(--line);border-radius:10px;padding:6px 10px;color:var(--sec);font-size:12px}
</style>
<!-- Replaces the rejected fixed-height 32 pt two-line diagram. Hierarchy: artwork + identity,
     "Blending now" card (executed style), OUT/IN side by side with real timing, phase rail,
     previous/play/next, tools row with the "…" overflow menu. -->
<script>
  for (const theme of ['light','dark']) {
    document.write(`<div class="phone ${theme}"><div class="art"></div>
    <div><b>Track 2</b><br><small style="color:var(--sec)">Artist · Album</small></div>
    <div class="card" aria-label="Blending Track 1 into Track 2, Crossfade, Overlap now, 6 seconds remaining">
      <div class="head">Blending now <b>Crossfade</b></div>
      <div class="decks">
        <div class="deck"><small>OUT</small>Track 1<div class="wave">${'<i style="height:60%"></i><i style="height:40%"></i><i style="height:30%"></i>'}</div><small>6 s left</small></div>
        <div class="deck in"><small>IN</small>Track 2<div class="wave">${'<i style="height:40%"></i><i style="height:70%"></i><i style="height:90%"></i>'}</div><small>in at 6 s</small></div>
      </div>
      <div class="rail"><span>Out</span><span class="on">Overlap now</span><span>In</span></div>
      <div class="bar"><div></div></div>
    </div>
    <div class="transport"><span>⏮</span><span>⏯</span><span>⏭</span></div>
    <div class="tools"><span>♥</span><span>＋</span><span>AirPlay</span><span>🌙</span><span class="menu">… menu: AirPlay/output · Sleep timer · Queue · Credits/Lyrics · Playback settings · Rate</span></div>
    </div>`);
  }
</script>
